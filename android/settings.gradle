// The Android app: a Trusted Web Activity that shows the live website full
// screen using the phone's Chrome. It is built by .github/workflows/build-apps.yml.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Studenv"
include ":app"
