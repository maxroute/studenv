<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Studenv timer</title>
    <link rel="stylesheet" href="mini.css" />
  </head>
  <body data-status="idle">
    <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="ring-track" cx="22" cy="22" r="19" />
      <circle id="ring" class="ring-left" cx="22" cy="22" r="19" pathLength="100" />
      <path class="ring-done" d="M14 22.5l5.5 5.5L30.5 17" />
    </svg>
    <div class="text">
      <div id="time" class="time">00:00</div>
      <div id="line" class="line"></div>
    </div>
    <div class="buttons">
      <button id="break" class="break" type="button">Start break</button>
      <button id="toggle" class="icon toggle" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14" /></svg>
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5l11 7-11 7z" /></svg>
      </button>
      <button id="open" class="icon" type="button" aria-label="Open Studenv" title="Open Studenv">
        <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8" /></svg>
      </button>
      <button id="hide" class="icon" type="button" aria-label="Hide for this session" title="Hide for this session">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <script src="timer-logic.js"></script>
    <script src="mini.js"></script>
  </body>
</html>
