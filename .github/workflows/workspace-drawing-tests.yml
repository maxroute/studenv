name: Workspace interaction tests

on:
  pull_request:
    paths:
      - "components/workspace/canvas.tsx"
      - "components/workspace/items/DrawingNode.tsx"
      - "lib/workspace/drawing-geometry.ts"
      - "lib/workspace/drawing-geometry.test.ts"
      - "lib/workspace/image-sizing.ts"
      - "lib/workspace/image-sizing.test.ts"
      - "lib/workspace/transform-engine.ts"
      - "lib/workspace/image-resize.test.ts"
      - "lib/workspace/pointer-session.ts"
      - "lib/workspace/pointer-session.test.ts"
      - "lib/workspace/connector-geometry.ts"
      - "lib/workspace/connector-geometry.test.ts"
      - "lib/workspace/connector-lifecycle.test.ts"
      - "lib/workspace/connector-anchors.ts"
      - "lib/workspace/connector-anchors.test.ts"
      - "lib/workspace/connector-target.ts"
      - "lib/workspace/connector-target.test.ts"
      - "lib/workspace/connector-routing.ts"
      - "lib/workspace/connector-routing.test.ts"
      - "lib/workspace/connector-path.ts"
      - "lib/workspace/connector-path.test.ts"
      - "lib/workspace/connector-lifecycle.ts"
      - "lib/workspace/connector-label.ts"
      - "lib/workspace/connector-selection.ts"
      - "lib/workspace/connector-selection.test.ts"
      - "lib/workspace/connector-label.test.ts"
      - "lib/workspace/connector-style.ts"
      - "lib/workspace/connector-style.test.ts"
      - "components/workspace/ConnectorGraphic.tsx"
      - "components/workspace/ConnectionOverlay.tsx"
      - "lib/workspace/shape-paths.ts"
      - "lib/workspace/selection-frame.ts"
      - "lib/workspace/selection-frame.test.ts"
      - "lib/workspace/selection-engine.ts"
      - "lib/workspace/shape-engine.ts"
      - "components/workspace/connectors/**"
      - "lib/workspace/connector-autocomplete.ts"
      - "lib/workspace/connector-autocomplete.test.ts"
      - "lib/workspace/connector-ui-store.ts"
      - "lib/workspace/keyboard-shortcuts.ts"
      - "components/workspace/WorkspaceConnectorsLayer.tsx"
      - "components/workspace/shapes/SelectionOverlay.tsx"
      - "components/workspace/items/studio-item.tsx"
      - "lib/workspace/rotate-handles.ts"
      - "lib/workspace/rotate-handles.test.ts"
      - "lib/workspace/workspace-history.ts"
      - "lib/workspace/workspace-history.test.ts"
      - "hooks/use-workspace-store.ts"
      - "types/workspace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workspace-drawing-tests.yml"

jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:workspace
