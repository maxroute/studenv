name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/email-verification-flow]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studenv?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studenv?schema=public
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
