name: Build Desktop Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} Desktop App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install Dependencies
        working-directory: react-app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: react-app
        run: npx prisma generate

      - name: Build and Package App (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: react-app
        run: npm run desktop:build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      - name: Build and Package App (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: react-app
        run: npm run desktop:build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studenv-desktop-${{ matrix.os }}
          path: react-app/release/
