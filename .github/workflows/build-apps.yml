# Builds the downloadable Studenv apps on GitHub's free machines, and checks that
# each one starts. It publishes nothing: the files are attached to the run.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/native-apps"
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      # Set in the repository's secrets once there is a release key. Without them
      # the app is signed with a throwaway key (for trying out only).
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STUDENV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      STUDENV_KEY_ALIAS: studenv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Use the release key, if there is one
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studenv.keystore"
          echo "STUDENV_KEYSTORE_FILE=$RUNNER_TEMP/studenv.keystore" >> "$GITHUB_ENV"
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Check the signature and name
        run: |
          mkdir -p out
          kind=$([ -n "$KEYSTORE_BASE64" ] && echo release || echo test)
          apk="out/Studenv-1.0.0-android-$kind.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" | tee out/signature.txt
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|application-label:|sdkVersion|targetSdkVersion)" | tee out/badging.txt
          grep -q "application-label:'Studenv'" out/badging.txt
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/studenv.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: studenv-android
          path: out/

  android-start:
    name: Android app starts
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studenv-android
          path: out
      - name: Allow the emulator to use virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # One line per command: this action runs each line on its own.
          script: |
            mkdir -p shots
            adb install out/*.apk
            adb shell monkey -p online.studenv.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > shots/launch.png
            adb logcat -d > shots/logcat.txt
            sh -c '! grep -A3 "FATAL EXCEPTION" shots/logcat.txt | grep online.studenv.app'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studenv-android-screens
          path: shots/

  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the installer
        run: npx --yes electron-builder@26.18.0 --config electron-builder.yml --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install it, then open the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/*-windows-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $link = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Studenv.lnk"
          if (-not (Test-Path $link)) { throw "The installer made no 'Studenv' Start menu shortcut." }
          $exe = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          $about = (Get-Item $exe).VersionInfo
          "Installed: $exe`nProduct: $($about.ProductName)`nDescription: $($about.FileDescription)`nCompany: $($about.CompanyName)"
          if ($about.ProductName -ne "Studenv" -or $about.FileDescription -ne "Studenv") { throw "The program isn't named Studenv." }
          $app = Start-Process $exe -ArgumentList "--smoke-test=$PWD\smoke" -PassThru
          if (-not $app.WaitForExit(120000)) { throw "The app didn't finish its start-up check." }
          Get-Content smoke/report.json
          if ($app.ExitCode -ne 0) { throw "The app didn't open Studenv." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studenv-windows
          path: |
            desktop/dist/windows/*-windows-setup.exe
            desktop/smoke/

  mac:
    name: Mac app (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node node_modules/electron/install.js
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: studenv-mac-${{ matrix.arch }}
          path: desktop/dist/*.dmg
