<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Center Dot -->
  <circle cx="50" cy="50" r="5" fill="#FFD200" />
  
  <!-- Upper S-Arrow -->
  <g id="arrow-half">
    <path d="M 58 50 C 58 35, 34 38, 34 26 C 34 16, 44 14, 52 14" stroke="#FFD200" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 45 8 L 53 14 L 45 20" stroke="#FFD200" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Lower S-Arrow (Symmetrical Rotated 180 deg around center) -->
  <use href="#arrow-half" transform="rotate(180 50 50)" />
</svg>
